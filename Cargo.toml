[package]
name = "micro_os"
version = "0.1.0"
edition = "2021"

[dependencies]
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14"
pic8259 = "0.10"
pc-keyboard = "0.7"
uart_16550 = "0.2.0"

[dependencies.bootloader]
version = "0.9"
features = ["map_physical_memory"]

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[dependencies.smoltcp]
version = "0.12"
default-features = false
features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-icmp", "socket-tcp", "socket-udp", "proto-dhcpv4"]

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none",
    "-drive", "format=raw,file=disk.img,if=ide,index=1,media=disk",
    "-device", "e1000,netdev=net0",
    "-netdev", "user,id=net0"
]
run-args = [
    "-serial", "stdio",
    "-drive", "format=raw,file=disk.img,if=ide,index=1,media=disk",
    "-device", "e1000,netdev=net0",
    "-netdev", "user,id=net0"
]
test-success-exit-code = 33
test-timeout = 300

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "heap_allocation"
harness = false

[[test]]
name = "filesystem"
harness = false

[[test]]
name = "networking"
harness = false

[[test]]
name = "wifi"
harness = false
